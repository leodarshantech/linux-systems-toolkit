# /etc/sys-backup-rotate.conf — read by sys-backup-rotate.service
#
# Absolute paths to back up, separated by spaces.
BACKUP_SOURCES="/etc"

# Where archives are written. For a path outside /var/backups also run
#   systemctl edit sys-backup-rotate.service
# and add:  [Service]  ReadWritePaths=/your/backup/path
BACKUP_DEST="/var/backups/sys-backup-rotate"

# Extra options passed to sys-backup-rotate (see sys-backup-rotate --help).
BACKUP_OPTS="--keep-daily 7 --keep-weekly 4 --keep-monthly 3"
